name: Security Sandbox & Pipeline Tests

on:
  push:
    branches: [main, "sec/*"]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-22.04

    env:
      OPENAI_API_KEY: sk-dummy-ci-not-a-real-secret
      GEMINI_API_KEY: dummy-ci-not-a-real-secret
      NO_PROXY: localhost,127.0.0.1

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pyyaml python-dotenv openai
      - name: Pull pinned sandbox container image (immutable digest)
        run: docker pull python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      - name: Compile check
        run: python -m compileall -q -x "(\.venv|legacy/salvage_and_audit\.py|legacy/test_llm\.py)" .
      - name: Security regression tests (linux_ns backend, required)
        env:
          VGCL_SANDBOX_BACKEND: linux_ns
          VGCL_REQUIRE_SANDBOX: "1"
        run: pytest test_security_sandbox.py -v
      - name: Security regression tests (container backend, required)
        env:
          VGCL_SANDBOX_BACKEND: container
          VGCL_REQUIRE_SANDBOX: "1"
        run: pytest test_security_sandbox.py -v
      - name: Full test suite (container backend, required)
        env:
          VGCL_SANDBOX_BACKEND: container
          VGCL_REQUIRE_SANDBOX: "1"
        run: pytest -v

  windows-fail-closed:
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: sk-dummy-ci-not-a-real-secret
      GEMINI_API_KEY: dummy-ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fail-closed behavior when container runtime is absent
        run: |
          python -m pip install numpy pyyaml
          python -m unittest test_security_sandbox.TestSecuritySandbox.test_19_fail_closed_deterministic_backend_policy -v
